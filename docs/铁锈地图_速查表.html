<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁锈地图制作 · 属性与指令速查</title>
<style>
  :root{
    --bg:#1e1e1e; --panel:#2b2b2b; --bar:#333333; --card:#252525;
    --line:#3d3d3d; --text:#e6e6e6; --muted:#9aa2ac; --accent:#2f86dc;
    --warn:#e0a44a; --ok:#6cbf84; --bad:#e07373; --code:#171717;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.6}
  header{background:var(--bar);border-bottom:1px solid var(--line);padding:18px 24px 14px;position:sticky;top:0;z-index:5}
  h1{margin:0 0 4px;font-size:19px;font-weight:700;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:12px}
  .sub b{color:var(--accent);font-weight:600}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  #q{flex:1;min-width:220px;background:var(--code);border:1px solid var(--line);border-radius:6px;
     color:var(--text);padding:9px 12px;font-size:14px;outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,134,220,.2)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
  .tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:14px;
       padding:4px 12px;cursor:pointer;font-size:12px}
  .tab:hover{border-color:var(--accent);color:var(--text)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  main{padding:18px 24px 60px;max-width:1500px;margin:0 auto}
  #count{color:var(--muted);font-size:12px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .card:hover{border-color:#555}
  .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .name{font-family:Consolas,"Cascadia Mono",monospace;font-size:14px;font-weight:700;color:#8ec5ff}
  .badge{font-size:10px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}
  .badge.cmd{color:#c9a7ff;border-color:#5b4a7a}
  .badge.tile{color:var(--ok);border-color:#3d6b48}
  .badge.pit{color:var(--bad);border-color:#7a4141}
  .badge.auto{color:var(--warn);border-color:#7a6131}
  .desc{font-size:13px;margin:2px 0 8px}
  .kv{font-size:12px;color:var(--muted);display:flex;gap:6px;margin-top:3px}
  .kv span:first-child{color:#7f8892;min-width:34px;flex-shrink:0}
  code{background:var(--code);border:1px solid var(--line);border-radius:3px;padding:1px 5px;
       font-family:Consolas,monospace;font-size:12px;color:#f0c987}
  .src{font-size:10px;color:#6f7780;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
  .empty{color:var(--muted);padding:40px;text-align:center}
  footer{color:#6f7780;font-size:11px;text-align:center;padding:0 24px 30px}
  kbd{background:var(--code);border:1px solid var(--line);border-radius:3px;padding:0 5px}
</style>
</head>
<body>
<header>
  <h1>铁锈地图制作 · 属性与指令速查 <span style="color:var(--accent);font-size:13px;font-weight:400">1.15</span></h1>
  <div class="sub">数据来源：本机 <b>23 张有效 TMX</b>（24 个文件中 1 个坏 XML）+ 官方 readme / Wiki / 社区教程整理。完整版见 <code>docs/铁锈地图_属性与指令速查.md</code></div>
  <div class="toolbar">
    <input id="q" placeholder="搜索属性或指令，例如 spawnUnits / team / map_info / 错拼 …（按 / 聚焦）" autocomplete="off">
    <span id="count"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的条目，换个关键词试试。</div>
</main>
<footer>「指令」= Triggers 对象层的 type/name；游戏内聊天指令、单位 ini 脚本不在本表。按 <kbd>/</kbd> 搜索，<kbd>Esc</kbd> 清空。</footer>

 {n:"Ground 未填满",c:"pit",d:"地形层必须填满；资源池必须整块 3×3 放 Items。",v:"—",s:"官方 readme + Wiki"},
 {n:"set 层当最终地形",c:"pit",d:"set 层游戏完全忽略，只是自动映射输入。",v:"—",s:"官方 readme"},
 {n:"坏 XML 地图",c:"pit",d:"本机 爱琴海海战（10p）.tmx 首字符非 '<'，不是有效 TMX，统计时被跳过。",v:"—",s:"本机实测"}
];

const tabsEl=document.getElementById('tabs'), grid=document.getElementById('grid');
const qEl=document.getElementById('q'), countEl=document.getElementById('count');
let cat='all';
function tab(label,key){const b=document.createElement('button');b.className='tab'+(cat===key?' on':'');b.textContent=label;b.onclick=()=>{cat=key;render();};return b;}
function renderTabs(){
  tabsEl.innerHTML='';
  tabsEl.appendChild(tab('全部','all'));
  for(const k in CATS) tabsEl.appendChild(tab(CATS[k].label,k));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){
  renderTabs();
  const q=qEl.value.trim().toLowerCase();
  const list=DATA.filter(d=>(cat==='all'||d.c===cat) &&
    (!q || [d.n,d.d,d.v,d.s||'',d.f||'',CATS[d.c].label].join(' ').toLowerCase().includes(q)));
  countEl.textContent='共 '+list.length+' 条 / 总计 '+DATA.length+' 条';
  document.getElementById('empty').style.display=list.length?'none':'block';
  grid.innerHTML=list.map(d=>{
    const meta=CATS[d.c];
    return '<div class="card"><div class="top"><span class="name">'+esc(d.n)+'</span>'+
      '<span class="badge '+meta.cls+'">'+meta.label+'</span></div>'+
      '<div class="desc">'+esc(d.d)+'</div>'+
      '<div class="kv"><span>取值</span><span><code>'+esc(d.v)+'</code></span></div>'+
      (d.f?'<div class="kv"><span>频次</span><span>'+esc(d.f)+'</span></div>':'')+
      '<div class="src">来源：'+esc(d.s||'')+'</div></div>';
  }).join('');
}
qEl.addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
  if(e.key==='Escape'&&document.activeElement===qEl){qEl.value='';render();qEl.blur();}
});
render();
</script>
